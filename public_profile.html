<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>LakeLoom profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root{color-scheme:light;--ink:#19352f;--muted:#748780;--line:#dbe7e1;--green:#19745e}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;background:linear-gradient(145deg,#f7faf8,#edf4f0);font-family:'DM Sans',sans-serif;color:var(--ink)}main{width:min(620px,100%);padding:42px;border:1px solid var(--line);border-radius:22px;background:#fff;box-shadow:0 24px 70px #173b2d18;text-align:center}.brand{margin-bottom:32px;font:800 20px 'Manrope',sans-serif}.brand span{color:#7ca36d}.photo{width:150px;height:150px;margin:0 auto 22px;display:grid;place-items:center;overflow:hidden;border:5px solid #edf5ef;border-radius:50%;background:#e8f1eb;color:#356a57;font-size:46px;font-weight:700}.photo img{width:100%;height:100%;object-fit:cover}h1{margin:0;font:800 32px 'Manrope',sans-serif;overflow-wrap:anywhere}p{margin:8px 0 28px;color:var(--muted)}a{display:inline-flex;padding:12px 20px;border-radius:10px;background:var(--green);color:#fff;text-decoration:none;font-weight:700}@media(max-width:520px){main{padding:30px 20px}h1{font-size:26px}.photo{width:124px;height:124px}}
    </style>
  </head>
  <body>
    <main><div class="brand">LakeLoom<span>.</span></div><div class="photo" id="photo"></div><h1 id="username">Loading profile…</h1><p>LakeLoom public profile</p><a href="/">Open LakeLoom</a></main>
    <script>
      const username = decodeURIComponent(location.pathname.slice(1));
      fetch(`/api/public/profiles/${encodeURIComponent(username)}`).then(response => {
        if (!response.ok) throw new Error();
        return response.json();
      }).then(profile => {
        document.title = `${profile.username} · LakeLoom`;
        document.getElementById('username').textContent = profile.username;
        const photo = document.getElementById('photo');
        if (profile.photoUrl) {
          const image = document.createElement('img');
          image.src = profile.photoUrl;
          image.alt = `${profile.username} profile photo`;
          photo.append(image);
        } else {
          photo.textContent = profile.username.charAt(0).toUpperCase();
        }
      }).catch(() => {
        document.getElementById('username').textContent = 'Profile unavailable';
        document.getElementById('photo').textContent = '?';
      });
    </script>
  </body>
</html>
